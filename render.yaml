services:
  - type: web
    name: dna-erp-be
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: THROTTLE_TTL
        value: '60'
      - key: THROTTLE_LIMIT
        value: '100'
      - key: LOG_LEVEL
        value: info
      - key: SOLVER_TIMEOUT_SECONDS
        value: '1700'
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Số lớp proxy trước app, để BE thấy IP thật của client (giới hạn mạng công ty cho công nhân). Bắt đầu 1; kiểm bằng nút
      # "Thêm IP hiện tại của tôi" ở Cấu hình hệ thống so với trang "what is my ip" - nếu ra IP của Cloudflare/Render thì đổi thành '2'.
      # KHÔNG đặt true (client giả được X-Forwarded-For). Xem docs/changelog-2026-10-08-ke-hoach-tem-qr-bo-sat-phoi.md mục 28.6.
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Realtime nhiều instance: đặt URL Redis (vd Render Key Value). Để trống = 1 instance.
      - key: REDIS_URL
        sync: false
